base = ".."

[[input]]
name = "SCHED"
dir = "Personal Scheduler App"
driver = "obsidian"
atype = "SRS"
marker = "REQ"
publish = "publish.yaml"

[drivers.obsidian]
integration = true
exclude_elements = [
  {name = "tags", mode = "string-on-start"},
]

[metrics]
enabled = true
requirement_type = "REQ"
status_field = "status"
verify_field = "verify"
tbd_marker = "TBD"
output_format = "markdown"
output_file = "output/metrics.md"

[impact]
enabled = true
output_format = "markdown"
output_file = "output/impact.md"

[metamodel]
filename = "project.syntagmax"
