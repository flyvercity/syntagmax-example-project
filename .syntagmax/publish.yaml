start_level: 1
include_plain_text: true
remove_numeric_prefixes_in_headers: true
contents_marker: "content"

render:
  SRS:
    - type: table
      attributes:
        - id:
            alias: "ID"
        - parent:
            alias: "SoR"
        - safety:
            alias: "SFTY"
        - func:
            alias: "Function"
        - alloc:
            alias: "Allocation"
        - derive:
            alias: "Derived"
    - type: text
      mode: block
      attributes:
        - contents:
            alias: "Requirement"
    - type: text
      mode: inline
      attributes:
        - RATIO:
            alias: "Rationale"
        - COMMENT:
            alias: "Comment"
  COM:
    - type: text
      mode: inline
      alias: "Comment"
      
  DES:
    - type: text
      mode: inline
      alias: "Description"

docx-template:
  default-template: "templates/template.dotm"
  overrides:
    system-requirements: "templates/template.dotm"
    implementation: "none"